
---
- name: Install Docker on the tradelive VM
  hosts: tradelive
  become: yes

  tasks:
    - name: Install the prerequisites
      apt:
        name:
          - ca-certificates
          - curl
        update_cache: yes
        state: present

    - name: Make sure the keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download the Docker repository key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add the Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: yes
        state: present

    - name: Start Docker and enable it at boot
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Let the vagrant user run docker without sudo
      user:
        name: vagrant
        groups: docker
        append: yes
