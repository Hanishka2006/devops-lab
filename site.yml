---
- name: Provision the tradelive VM
  hosts: tradelive
  become: yes
  become_method: sudo
  vars_files:
    - vars/secrets.yml
  tasks:
    - name: Install libpam-pwquality
      package:
        name: libpam-pwquality
        state: present

    - name: Enforce a strong password policy
      lineinfile:
        path: /etc/pam.d/common-password
        regexp: pam_pwquality.so
        state: present
        line: >-
          password required pam_pwquality.so minlen=12
          lcredit=-1 ucredit=-1 dcredit=-1 ocredit=-1 retry=3

    - name: Ensure group developers exists
      group:
        name: developers
        state: present

    - name: Create the user trader
      user:
        name: trader
        shell: /bin/bash
        password: "{{ trader_hash }}"

    - name: Assign trader to the developers group
      user:
        name: trader
        groups: developers
        append: yes

    - name: Install my public key for trader
      authorized_key:
        user: trader
        state: present
        key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_ed25519.pub') }}"
    - name: Install the Google Authenticator PAM module
      apt:
        name: libpam-google-authenticator
        update_cache: yes
        state: present
    - name: Tell PAM to use Google Authenticator for SSH
      lineinfile:
        path: /etc/pam.d/sshd
        line: "auth required pam_google_authenticator.so nullok"
        state: present
      notify: Restart SSH

    - name: Turn off PAM password logins for SSH
      lineinfile:
        path: /etc/pam.d/sshd
        regexp: '^@include common-auth'
        line: "#@include common-auth"
      notify: Restart SSH

    - name: Allow keyboard-interactive logins
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?KbdInteractiveAuthentication'
        line: "KbdInteractiveAuthentication yes"
      notify: Restart SSH

    - name: Require key AND code for trader only
      blockinfile:
        path: /etc/ssh/sshd_config
        marker: "# {mark} TRADER 2FA"
        block: |
          Match User trader
          AuthenticationMethods publickey,keyboard-interactive
      notify: Restart SSH
    - name: Install a sudoers policy for the developers group
      copy:
        dest: /etc/sudoers.d/developers
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
        content: |
          Cmnd_Alias SERVICE_CMDS = /usr/bin/systemctl status ssh, \
            /usr/bin/systemctl restart ssh
          Cmnd_Alias PKG_CMDS = /usr/bin/apt update
          %developers ALL=(ALL) NOPASSWD: SERVICE_CMDS, PKG_CMDS

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted
